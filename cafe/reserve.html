<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Table — Linguini & Leaf Bistro</title>
  <meta name="description" content="Book your private dining table or celebratory gathering at Linguini & Leaf Bistro.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/shared-components.css">
  <style>
    :root {
      --cafe-espresso: #2a170d;
      --cafe-terracotta: #c85a32;
      --cafe-cream: #faf6f0;
      --cafe-border: #e8ded2;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background-color: var(--cafe-cream);
      color: var(--cafe-espresso);
      line-height: 1.6;
    }

    /* Navigation */
    .cafe-nav {
      position: sticky;
      top: 36px;
      z-index: 999;
      background: rgba(250, 246, 240, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--cafe-border);
    }
    .cafe-nav-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cafe-brand {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--cafe-espresso);
      text-decoration: none;
    }
    .cafe-brand span { color: var(--cafe-terracotta); }
    .cafe-nav-links { display: flex; gap: 28px; align-items: center; }
    .cafe-nav-links a {
      color: var(--cafe-espresso);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .cafe-nav-links a.active { color: var(--cafe-terracotta); }

    /* Reservation Layout */
    .reserve-wrap {
      max-width: 1000px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }
    .reserve-card {
      background: #fff;
      border: 1px solid var(--cafe-border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(42, 23, 13, 0.04);
    }
    .reserve-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .reserve-header h1 {
      font-family: var(--font-serif);
      font-size: 36px;
      margin-bottom: 8px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .form-full { grid-column: span 2; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cafe-espresso);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--cafe-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14.5px;
    }
    .btn-submit-reserve {
      background: var(--cafe-terracotta);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <!-- Orbitex Standalone Return Bar -->
  <div class="orbitex-return-bar">
    <div class="orbitex-return-container">
      <a href="../index.html" class="orbitex-return-btn">← Back to Orbitex Portfolio</a>
      <span class="orbitex-return-tag">Template Preview: <b>Linguini & Leaf Bistro — Table Reservation</b></span>
      <a href="../index.html#access" class="orbitex-return-cta">Use This Template ↗</a>
    </div>
  </div>

  <!-- Navbar -->
  <header class="cafe-nav">
    <div class="cafe-nav-wrap">
      <a href="index.html" class="cafe-brand">LINGUINI & LEAF <span>BISTRO</span></a>
      <nav class="cafe-nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Digital Menu</a>
        <a href="reserve.html" class="active">Table Reservation</a>
        <a href="order.html">Takeaway & Delivery</a>
      </nav>
      <a href="menu.html" style="background:var(--cafe-espresso); color:#fff; padding:8px 18px; border-radius:20px; text-decoration:none; font-size:13px; font-weight:700;">View Menu 🍕</a>
    </div>
  </header>

  <!-- Reservation Main Container -->
  <main class="reserve-wrap">
    <div class="reserve-card">
      <div class="reserve-header">
        <h1>Book Your Table</h1>
        <p>Celebrate an anniversary, romantic dinner, or weekend brunch with us.</p>
      </div>

      <form onsubmit="handleReserve(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="resName" required placeholder="e.g. Sarthak Dave">
          </div>
          <div class="form-group">
            <label>WhatsApp / Phone Number</label>
            <input type="tel" id="resPhone" required placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Date & Time Slot</label>
            <input type="datetime-local" id="resDateTime" required>
          </div>
          <div class="form-group">
            <label>Number of Guests</label>
            <select id="resGuests">
              <option>2 Guests (Table for Two)</option>
              <option>3 - 4 Guests (Standard Table)</option>
              <option>5 - 8 Guests (Family Booth)</option>
              <option>9+ Guests (Private Dining Lounge)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Seating Ambience Preference</label>
            <select id="resSeating">
              <option>🌿 Outdoor Tuscan Garden Patio</option>
              <option>🕯️ Indoor Candlelight Dining</option>
              <option>🍸 Bar & Cocktail High-Top</option>
            </select>
          </div>
          <div class="form-group">
            <label>Occasion / Special Request</label>
            <input type="text" id="resOccasion" placeholder="e.g. Birthday celebration, High chair needed">
          </div>
        </div>

        <button type="submit" class="btn-submit-reserve">Confirm Reservation via WhatsApp Host 🍷</button>
      </form>
    </div>
  </main>

  <script src="../scripts/shared-components.js"></script>
  <script>
    function handleReserve(e) {
      e.preventDefault();
      const name = document.getElementById('resName').value;
      const phone = document.getElementById('resPhone').value;
      const dt = document.getElementById('resDateTime').value;
      const guests = document.getElementById('resGuests').value;
      const seating = document.getElementById('resSeating').value;
      const occasion = document.getElementById('resOccasion').value;

      if (window.OrbitexToast) OrbitexToast.success('Reservation request sent! Connecting to bistro...');
      const msg = encodeURIComponent(`Hi Linguini & Leaf Bistro! I would like to reserve a table.\nName: ${name}\nPhone: ${phone}\nDate & Time: ${dt}\nGuests: ${guests}\nSeating: ${seating}\nNotes: ${occasion}`);
      setTimeout(() => {
        window.open(`https://wa.me/919876543210?text=${msg}`, '_blank');
      }, 700);
    }
  </script>
</body>
</html>
