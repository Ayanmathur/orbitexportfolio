<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Salon Appointment — The Silk Salon</title>
  <meta name="description" content="Choose your preferred master stylist and reserve your salon pampering slot.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/shared-components.css">
  <style>
    :root {
      --salon-rose: #d48d7d;
      --salon-blush: #faf5f0;
      --salon-dark: #262626;
      --salon-border: #ebdcd5;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background-color: var(--salon-blush);
      color: var(--salon-dark);
      line-height: 1.6;
    }

    /* Navbar */
    .salon-nav {
      position: sticky;
      top: 36px;
      z-index: 999;
      background: rgba(250, 245, 240, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--salon-border);
    }
    .salon-nav-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .salon-brand {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--salon-dark);
      letter-spacing: 2px;
      text-decoration: none;
    }
    .salon-brand span { color: var(--salon-rose); }
    .salon-nav-links { display: flex; gap: 28px; }
    .salon-nav-links a {
      color: var(--salon-dark);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .salon-nav-links a.active { color: var(--salon-rose); }

    /* Book Layout */
    .book-wrap {
      max-width: 900px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }
    .book-card {
      background: #fff;
      border: 1px solid var(--salon-border);
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(212, 141, 125, 0.08);
    }
    .book-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .book-header h1 {
      font-family: var(--font-serif);
      font-size: 34px;
      margin-bottom: 6px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .form-full { grid-column: span 2; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--salon-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .btn-submit-appt {
      background: var(--salon-rose);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14.5px;
      width: 100%;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <!-- Orbitex Standalone Return Bar -->
  <div class="orbitex-return-bar">
    <div class="orbitex-return-container">
      <a href="../index.html" class="orbitex-return-btn">← Back to Orbitex Portfolio</a>
      <span class="orbitex-return-tag">Template Preview: <b>The Silk Salon & Spa — Appointment Booking</b></span>
      <a href="../index.html#access" class="orbitex-return-cta">Use This Template ↗</a>
    </div>
  </div>

  <!-- Navbar -->
  <header class="salon-nav">
    <div class="salon-nav-wrap">
      <a href="index.html" class="salon-brand">THE SILK <span>SALON</span></a>
      <nav class="salon-nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services Menu</a>
        <a href="book.html" class="active">Book Appointment</a>
      </nav>
      <a href="services.html" style="background:var(--salon-dark); color:#fff; padding:8px 18px; border-radius:20px; text-decoration:none; font-size:13px; font-weight:700;">Services Menu ✂️</a>
    </div>
  </header>

  <!-- Appointment Main Container -->
  <main class="book-wrap">
    <div class="book-card">
      <div class="book-header">
        <h1>Reserve Your Pampering Slot</h1>
        <p>Select your master stylist and preferred service ritual.</p>
      </div>

      <form onsubmit="handleSalonAppt(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Client Full Name</label>
            <input type="text" id="salonCustName" required placeholder="e.g. Radhika Apte">
          </div>
          <div class="form-group">
            <label>WhatsApp / Phone Number</label>
            <input type="tel" id="salonCustPhone" required placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Master Stylist Preference</label>
            <select id="salonStylist">
              <option>Ananya Sen (Creative Hair Director)</option>
              <option>Kabir Roy (Senior Colorist & Balayage)</option>
              <option>Tara D'Souza (Bridal Skin Specialist)</option>
              <option>First Available Stylist</option>
            </select>
          </div>
          <div class="form-group">
            <label>Primary Service</label>
            <select id="salonService">
              <option>French Balayage & Gloss (₹6,500)</option>
              <option>Nano-Keratin Smoothing Infusion (₹5,500)</option>
              <option>Ayurvedic Kesh Vardhan Scalp Spa (₹2,800)</option>
              <option>Signature Silk Blowout (₹1,200)</option>
              <option>Hydra-Dew Glow Facial (₹3,500)</option>
            </select>
          </div>
          <div class="form-group form-full">
            <label>Preferred Date & Time</label>
            <input type="datetime-local" id="salonDate" required>
          </div>
        </div>

        <button type="submit" class="btn-submit-appt">Confirm Appointment on WhatsApp 💬</button>
      </form>
    </div>
  </main>

  <script src="../scripts/shared-components.js"></script>
  <script>
    function handleSalonAppt(e) {
      e.preventDefault();
      const name = document.getElementById('salonCustName').value;
      const phone = document.getElementById('salonCustPhone').value;
      const stylist = document.getElementById('salonStylist').value;
      const srv = document.getElementById('salonService').value;
      const dt = document.getElementById('salonDate').value;

      if (window.OrbitexToast) OrbitexToast.success('Appointment booked! Connecting to salon desk on WhatsApp...');
      const msg = encodeURIComponent(`Hi The Silk Salon! I would like to book an appointment.\nService: ${srv}\nStylist: ${stylist}\nDate & Time: ${dt}\nClient: ${name}\nPhone: ${phone}`);
      setTimeout(() => {
        window.open(`https://wa.me/919876543210?text=${msg}`, '_blank');
      }, 700);
    }
  </script>
</body>
</html>
