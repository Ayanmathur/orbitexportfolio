<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book 2 Free Demo Classes — Apex Masters Academy</title>
  <meta name="description" content="Experience our classroom teaching with 2 complimentary demo lectures and diagnostic scholarship assessment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/shared-components.css">
  <style>
    :root {
      --edu-blue: #2563eb;
      --edu-navy: #0f172a;
      --edu-card: #ffffff;
      --edu-bg: #f8fafc;
      --edu-border: #e2e8f0;
      --font-heading: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--edu-bg);
      color: #334155;
      line-height: 1.6;
    }

    /* Navbar */
    .edu-nav {
      position: sticky;
      top: 36px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--edu-border);
    }
    .edu-nav-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .edu-brand {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 900;
      color: var(--edu-navy);
      text-decoration: none;
    }
    .edu-brand span { color: var(--edu-blue); }
    .edu-nav-links { display: flex; gap: 28px; }
    .edu-nav-links a {
      color: #475569;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .edu-nav-links a.active { color: var(--edu-blue); font-weight: 700; }

    /* Demo Layout */
    .demo-wrap {
      max-width: 900px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }
    .demo-card {
      background: #fff;
      border: 1px solid var(--edu-border);
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .demo-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .demo-header h1 {
      font-family: var(--font-heading);
      font-size: 34px;
      color: var(--edu-navy);
      margin-bottom: 6px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .form-full { grid-column: span 2; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: var(--edu-navy);
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--edu-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .btn-submit-demo {
      background: var(--edu-blue);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      width: 100%;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <!-- Orbitex Standalone Return Bar -->
  <div class="orbitex-return-bar">
    <div class="orbitex-return-container">
      <a href="../index.html" class="orbitex-return-btn">← Back to Orbitex Portfolio</a>
      <span class="orbitex-return-tag">Template Preview: <b>Apex Masters Academy — Demo Class Registration</b></span>
      <a href="../index.html#access" class="orbitex-return-cta">Use This Template ↗</a>
    </div>
  </div>

  <!-- Navbar -->
  <header class="edu-nav">
    <div class="edu-nav-wrap">
      <a href="index.html" class="edu-brand">APEX <span>MASTERS</span></a>
      <nav class="edu-nav-links">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses & Batches</a>
        <a href="demo.html" class="active">Free Demo Class</a>
      </nav>
      <a href="courses.html" style="background:var(--edu-blue); color:#fff; padding:8px 18px; border-radius:6px; font-weight:800; font-size:13px; text-decoration:none;">View Courses 📚</a>
    </div>
  </header>

  <!-- Demo Main -->
  <main class="demo-wrap">
    <div class="demo-card">
      <div class="demo-header">
        <h1>Register for 2 Free Demo Classes</h1>
        <p>No credit card required. Free diagnostic scholarship test included.</p>
      </div>

      <form onsubmit="handleDemoSubmit(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Student's Full Name</label>
            <input type="text" id="demoStudentName" required placeholder="e.g. Aarav Sharma">
          </div>
          <div class="form-group">
            <label>Parent's WhatsApp / Mobile Number</label>
            <input type="tel" id="demoParentPhone" required placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Target Competitive Exam</label>
            <select id="demoTargetExam">
              <option>IIT-JEE (Main + Advanced)</option>
              <option>NEET-UG (Medical)</option>
              <option>Class 9 / 10 Olympiad Foundation</option>
              <option>Class 12 Board Exam Booster</option>
            </select>
          </div>
          <div class="form-group">
            <label>Current School / Class</label>
            <input type="text" id="demoSchool" required placeholder="e.g. Class 11, DPS RK Puram">
          </div>
        </div>

        <button type="submit" class="btn-submit-demo">Claim Free Demo & WhatsApp Pass 📝</button>
      </form>
    </div>
  </main>

  <script src="../scripts/shared-components.js"></script>
  <script>
    function handleDemoSubmit(e) {
      e.preventDefault();
      const student = document.getElementById('demoStudentName').value;
      const phone = document.getElementById('demoParentPhone').value;
      const exam = document.getElementById('demoTargetExam').value;
      const school = document.getElementById('demoSchool').value;

      if (window.OrbitexToast) OrbitexToast.success('Demo class pass generated! Connecting to academic counselor on WhatsApp...');
      const msg = encodeURIComponent(`Hi Apex Masters Academy! I would like to book 2 free demo classes.\nTarget Exam: ${exam}\nStudent: ${student}\nParent Phone: ${phone}\nSchool & Class: ${school}`);
      setTimeout(() => {
        window.open(`https://wa.me/919876543210?text=${msg}`, '_blank');
      }, 700);
    }
  </script>
</body>
</html>
