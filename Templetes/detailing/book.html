<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Studio Inspection — Apex Auto Detailing</title>
  <meta name="description" content="Schedule a free digital paint thickness gauge inspection and detailing bay slot.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/shared-components.css">
  <style>
    :root {
      --auto-red: #e11d48;
      --auto-dark: #090a0f;
      --auto-card: #13161f;
      --auto-border: rgba(255, 255, 255, 0.12);
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--auto-dark);
      color: #f1f5f9;
      line-height: 1.6;
    }

    /* Navbar */
    .auto-nav {
      position: sticky;
      top: 36px;
      z-index: 999;
      background: rgba(9, 10, 15, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--auto-border);
    }
    .auto-nav-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auto-brand {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      text-decoration: none;
    }
    .auto-brand span { color: var(--auto-red); }
    .auto-nav-links { display: flex; gap: 28px; }
    .auto-nav-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .auto-nav-links a.active { color: #fff; }

    /* Book Layout */
    .book-wrap {
      max-width: 900px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }
    .book-card {
      background: var(--auto-card);
      border: 1px solid var(--auto-border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .book-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .book-header h1 {
      font-family: var(--font-heading);
      font-size: 34px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .form-full { grid-column: span 2; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: #1c202b;
      border: 1px solid var(--auto-border);
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
    }
    .btn-submit-auto {
      background: var(--auto-red);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 6px;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 14.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      width: 100%;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <!-- Orbitex Standalone Return Bar -->
  <div class="orbitex-return-bar">
    <div class="orbitex-return-container">
      <a href="../../index.html" class="orbitex-return-btn">← Back to Orbitex Portfolio</a>
      <span class="orbitex-return-tag">Template Preview: <b>Apex AutoCare — Studio Booking</b></span>
      <a href="../../index.html#access" class="orbitex-return-cta">Use This Template ↗</a>
    </div>
  </div>

  <!-- Navbar -->
  <header class="auto-nav">
    <div class="auto-nav-wrap">
      <a href="index.html" class="auto-brand">APEX <span>AUTOCARE</span></a>
      <nav class="auto-nav-links">
        <a href="index.html">Studio</a>
        <a href="services.html">Packages & PPF</a>
        <a href="book.html" class="active">Book Inspection</a>
      </nav>
      <a href="services.html" style="background:var(--auto-red); color:#fff; padding:8px 18px; border-radius:4px; font-family:var(--font-heading); font-weight:800; font-size:12px; text-decoration:none; text-transform:uppercase;">View Prices 🛡️</a>
    </div>
  </header>

  <!-- Book Main -->
  <main class="book-wrap">
    <div class="book-card">
      <div class="book-header">
        <h1>Schedule Studio Inspection</h1>
        <p style="color:#94a3b8;">Includes paint depth gauge meter reading & scratch analysis report.</p>
      </div>

      <form onsubmit="handleAutoBook(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Owner Full Name</label>
            <input type="text" id="autoOwnerName" required placeholder="e.g. Vikram Malhotra">
          </div>
          <div class="form-group">
            <label>WhatsApp / Mobile Number</label>
            <input type="tel" id="autoOwnerPhone" required placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Vehicle Make & Model</label>
            <input type="text" id="autoVehicleModel" required placeholder="e.g. BMW 330Li / Mahindra XUV700">
          </div>
          <div class="form-group">
            <label>Desired Treatment</label>
            <select id="autoTreatment">
              <option>Full Body Self-Healing TPU PPF (10-Yr Warranty)</option>
              <option>9H Matrix Graphene Ceramic Coating (5-Yr Warranty)</option>
              <option>Front Impact PPF Package</option>
              <option>Full Interior Steam Sanitization & Leather Spa</option>
            </select>
          </div>
          <div class="form-group form-full">
            <label>Preferred Inspection Date & Time</label>
            <input type="datetime-local" id="autoDate" required>
          </div>
        </div>

        <button type="submit" class="btn-submit-auto">Confirm Bay Slot on WhatsApp 🛡️</button>
      </form>
    </div>
  </main>

  <script src="../../scripts/shared-components.js"></script>
  <script>
    function handleAutoBook(e) {
      e.preventDefault();
      const name = document.getElementById('autoOwnerName').value;
      const phone = document.getElementById('autoOwnerPhone').value;
      const vehicle = document.getElementById('autoVehicleModel').value;
      const treat = document.getElementById('autoTreatment').value;
      const date = document.getElementById('autoDate').value;

      if (window.OrbitexToast) OrbitexToast.success('Studio bay booked! Connecting on WhatsApp...');
      const msg = encodeURIComponent(`Hi Apex AutoCare! I would like to book a studio appointment.\nTreatment: ${treat}\nCar Model: ${vehicle}\nSlot: ${date}\nOwner: ${name}\nPhone: ${phone}`);
      setTimeout(() => {
        window.open(`https://wa.me/919876543210?text=${msg}`, '_blank');
      }, 700);
    }
  </script>
</body>
</html>
