<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Visit — Aranya Hair & Skin Studio</title>
  <meta name="description" content="Reserve an unhurried hair or skin appointment at Aranya Studio in Civil Lines.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/shared-components.css">
  <style>
    :root {
      --forest: #1f3626;
      --forest-deep: #142419;
      --brass: #b8894f;
      --brass-light: #d9b479;
      --ivory: #f6f1e7;
      --blush: #e3b7a0;
      --ink: #22281f;
      --line: rgba(31, 54, 38, 0.14);
      --font-serif: 'Fraunces', serif;
      --font-sans: 'Work Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background-color: var(--ivory);
      color: var(--ink);
      line-height: 1.6;
    }
    h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 500; color: var(--forest-deep); }
    a { text-decoration: none; color: inherit; }

    /* Navbar */
    header.aranya-header {
      position: sticky;
      top: 36px;
      background: rgba(246, 241, 231, 0.94);
      backdrop-filter: blur(8px);
      z-index: 999;
      border-bottom: 1px solid var(--line);
    }
    .aranya-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      max-width: 1180px;
      margin: 0 auto;
    }
    .aranya-brand {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      color: var(--forest-deep);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .aranya-brand .leaf {
      width: 9px;
      height: 9px;
      border-radius: 50% 0 50% 50%;
      background: var(--brass);
      transform: rotate(45deg);
    }
    .aranya-nav-links { display: flex; gap: 36px; font-size: 14px; font-weight: 500; }
    .aranya-nav-links a.active { color: var(--forest-deep); border-bottom: 1.5px solid var(--brass); }

    /* Book Layout */
    .book-wrap {
      max-width: 860px;
      margin: 50px auto 90px;
      padding: 0 32px;
    }
    .book-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 48px;
      box-shadow: 0 20px 40px rgba(20,36,25,0.04);
    }
    .book-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }
    .book-header h1 { font-size: 36px; margin-bottom: 8px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    .form-full { grid-column: span 2; }
    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5a6154;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 2px;
      font-family: inherit;
      font-size: 14px;
      background: var(--ivory);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--forest-deep);
      background: #fff;
    }
    .btn-submit-aranya {
      background: var(--forest-deep);
      color: var(--ivory);
      border: none;
      padding: 16px;
      border-radius: 2px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.03em;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: span 1; }
      .book-card { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <!-- Orbitex Standalone Return Bar -->
  <div class="orbitex-return-bar">
    <div class="orbitex-return-container">
      <a href="../../index.html" class="orbitex-return-btn">← Back to Orbitex Portfolio</a>
      <span class="orbitex-return-tag">Template Preview: <b>Aranya — Appointment Scheduler</b></span>
      <a href="../../index.html#access" class="orbitex-return-cta">Use This Template ↗</a>
    </div>
  </div>

  <!-- Navbar -->
  <header class="aranya-header">
    <div class="aranya-nav">
      <a href="index.html" class="aranya-brand"><span class="leaf"></span>Aranya</a>
      <nav class="aranya-nav-links">
        <a href="index.html">Overview</a>
        <a href="services.html">Services & Pricing</a>
        <a href="book.html" class="active">Book a Visit</a>
      </nav>
      <a class="book-btn" href="services.html" style="background:var(--forest-deep); color:var(--ivory); padding:10px 20px; font-size:13px; font-weight:600; border-radius:2px;">Services (₹) 🌿</a>
    </div>
  </header>

  <!-- Main Booking -->
  <main class="book-wrap">
    <div class="book-card">
      <div class="book-header">
        <span class="eyebrow">Studio Reservation</span>
        <h1>Reserve Your Unhurried Session</h1>
        <p style="color:#5a6154;">We confirm all appointments personally via WhatsApp.</p>
      </div>

      <form onsubmit="handleAranyaBooking(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="aranyaName" required placeholder="e.g. Radhika Sharma">
          </div>
          <div class="form-group">
            <label>WhatsApp / Mobile Number</label>
            <input type="tel" id="aranyaPhone" required placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Ritual / Service</label>
            <select id="aranyaService">
              <option>Aranya Precision Hair Cut & Botanical Rinse (₹1,200)</option>
              <option>Kesh Vardhan Warm Ayurvedic Scalp Infusion (₹2,400)</option>
              <option>Deep Dew Glow Facial with Guasha (₹2,800)</option>
              <option>Bridal Trousseau Consultation</option>
            </select>
          </div>
          <div class="form-group">
            <label>Preferred Date & Time</label>
            <input type="datetime-local" id="aranyaDate" required>
          </div>
          <div class="form-group form-full">
            <label>Notes on Hair / Skin Texture</label>
            <textarea id="aranyaNotes" rows="3" placeholder="e.g. Fine, wavy hair prone to frizz. Looking for a low-maintenance bob cut."></textarea>
          </div>
        </div>

        <button type="submit" class="btn-submit-aranya">Request Studio Appointment on WhatsApp 🌿</button>
      </form>
    </div>
  </main>

  <script src="../../scripts/shared-components.js"></script>
  <script>
    function handleAranyaBooking(e) {
      e.preventDefault();
      const name = document.getElementById('aranyaName').value;
      const phone = document.getElementById('aranyaPhone').value;
      const service = document.getElementById('aranyaService').value;
      const date = document.getElementById('aranyaDate').value;
      const notes = document.getElementById('aranyaNotes').value;

      if (window.OrbitexToast) OrbitexToast.success('Booking requested! Opening WhatsApp desk...');
      const msg = encodeURIComponent(`Hi Aranya Studio! I would like to book an appointment.\nRitual: ${service}\nPreferred Slot: ${date}\nName: ${name}\nPhone: ${phone}\nNotes: ${notes}`);
      setTimeout(() => {
        window.open(`https://wa.me/919876543210?text=${msg}`, '_blank');
      }, 700);
    }
  </script>
</body>
</html>
