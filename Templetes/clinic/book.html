<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Doctor Appointment — Aura Care Clinic</title>
  <meta name="description" content="Schedule an in-clinic consultation or online video appointment with certified doctors.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/shared-components.css">
  <style>
    :root {
      --clinic-blue: #0891b2;
      --clinic-navy: #0f2942;
      --clinic-bg: #f8fafc;
      --clinic-border: #e2e8f0;
      --font-heading: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--clinic-bg);
      color: #334155;
      line-height: 1.6;
    }

    /* Navbar */
    .clinic-nav {
      position: sticky;
      top: 36px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--clinic-border);
    }
    .clinic-nav-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clinic-brand {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 900;
      color: var(--clinic-navy);
      text-decoration: none;
    }
    .clinic-brand span { color: var(--clinic-blue); }
    .clinic-nav-links { display: flex; gap: 28px; }
    .clinic-nav-links a {
      color: #475569;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .clinic-nav-links a.active { color: var(--clinic-blue); font-weight: 700; }

    /* Book Layout */
    .book-wrap {
      max-width: 900px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }
    .book-card {
      background: #fff;
      border: 1px solid var(--clinic-border);
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .book-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .book-header h1 {
      font-family: var(--font-heading);
      font-size: 34px;
      color: var(--clinic-navy);
      margin-bottom: 6px;
    }

    /* Mode Switcher */
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: #f1f5f9;
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .mode-btn {
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #64748b;
    }
    .mode-btn.active {
      background: #fff;
      color: var(--clinic-navy);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .form-full { grid-column: span 2; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: var(--clinic-navy);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--clinic-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .btn-submit-appt {
      background: var(--clinic-blue);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      width: 100%;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <!-- Orbitex Standalone Return Bar -->
  <div class="orbitex-return-bar">
    <div class="orbitex-return-container">
      <a href="../../index.html" class="orbitex-return-btn">← Back to Orbitex Portfolio</a>
      <span class="orbitex-return-tag">Template Preview: <b>Aura Care Clinic — Appointment Booking</b></span>
      <a href="../../index.html#access" class="orbitex-return-cta">Use This Template ↗</a>
    </div>
  </div>

  <!-- Navbar -->
  <header class="clinic-nav">
    <div class="clinic-nav-wrap">
      <a href="index.html" class="clinic-brand">AURA <span>CARE</span></a>
      <nav class="clinic-nav-links">
        <a href="index.html">Home</a>
        <a href="doctors.html">Doctors Directory</a>
        <a href="book.html" class="active">Book Appointment</a>
      </nav>
      <a href="doctors.html" style="background:var(--clinic-blue); color:#fff; padding:8px 18px; border-radius:6px; font-weight:800; font-size:13px; text-decoration:none;">Our Doctors 🩺</a>
    </div>
  </header>

  <!-- Appointment Main Container -->
  <main class="book-wrap">
    <div class="book-card">
      <div class="book-header">
        <h1>Schedule Your Consultation</h1>
        <p>Choose between In-Person Clinic Visit or Online HD Video Consultation.</p>
      </div>

      <!-- Mode Switcher -->
      <div class="mode-switcher">
        <button type="button" class="mode-btn active" onclick="setConsultMode('In-Clinic (₹500)', this)">🏥 In-Clinic Consultation (₹500)</button>
        <button type="button" class="mode-btn" onclick="setConsultMode('Online Video (₹300)', this)">📹 Tele-Consultation (₹300)</button>
      </div>

      <form onsubmit="handleApptSubmit(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Patient Full Name</label>
            <input type="text" id="patName" required placeholder="e.g. Sarthak Dave">
          </div>
          <div class="form-group">
            <label>WhatsApp / Phone Number</label>
            <input type="tel" id="patPhone" required placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Preferred Doctor / Specialty</label>
            <select id="patDoctor">
              <option>Dr. Rajesh Varma (Cardiology & Medicine)</option>
              <option>Dr. Priya Sharma (Dermatology & Skin)</option>
              <option>Dr. Arvind Mehta (Pediatrics & Child Care)</option>
              <option>Dental Surgery & Teeth Whitening</option>
            </select>
          </div>
          <div class="form-group">
            <label>Preferred Date & Time Slot</label>
            <input type="datetime-local" id="patSlot" required>
          </div>
          <div class="form-group form-full">
            <label>Describe Primary Symptoms or Health Goal</label>
            <textarea id="patSymptoms" rows="3" placeholder="e.g. Mild chest pain after exertion, Blood pressure checkup"></textarea>
          </div>
        </div>

        <button type="submit" class="btn-submit-appt">Confirm Slot on WhatsApp Clinic Desk 💬</button>
      </form>
    </div>
  </main>

  <script src="../../scripts/shared-components.js"></script>
  <script>
    let activeMode = 'In-Clinic (₹500)';

    function setConsultMode(mode, el) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      activeMode = mode;
    }

    function handleApptSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('patName').value;
      const phone = document.getElementById('patPhone').value;
      const doc = document.getElementById('patDoctor').value;
      const slot = document.getElementById('patSlot').value;
      const symptoms = document.getElementById('patSymptoms').value;

      if (window.OrbitexToast) OrbitexToast.success('Appointment booked! Connecting to clinic desk on WhatsApp...');
      const msg = encodeURIComponent(`Hi Aura Care Clinic! I would like to book a consultation.\nType: ${activeMode}\nDoctor/Specialty: ${doc}\nPreferred Slot: ${slot}\nPatient: ${name}\nPhone: ${phone}\nSymptoms: ${symptoms}`);
      setTimeout(() => {
        window.open(`https://wa.me/919876543210?text=${msg}`, '_blank');
      }, 700);
    }
  </script>
</body>
</html>
